name: Python Auto Run Test

on:
  push:
    branches: [ "main" ] # コード保存時に自動実行
  schedule:
    - cron: '0 1 * * 2' # 日本時間の毎週火曜日 10:00
  workflow_dispatch: # ★ここを追加（手動実行を可能にする）

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      # ★ここにライブラリインストールの手順を追加します
      - name: 必要なライブラリのインストール
        run: pip install requests beautifulsoup4 pandas
        
      - name: Pythonスクリプトの実行
        run: python main.py
        
      - name: 生成されたCSVをまとめて保存
        uses: actions/upload-artifact@v4
        with:
          name: scraping-results
          path: '*.csv'
  
      - name: CSVファイルをメールで送信
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: 【自動送信】スクレイピング結果のCSVファイル
          to: ${{ secrets.GMAIL_ADDRESS }} # 宛先（自分から自分へ送ります）
          from: GitHub Actions
          body: スクレイピングが完了しました。添付のCSVファイル（output_deleted_date.csv）を確認してください。
          attachments: output_deleted_date.csv
