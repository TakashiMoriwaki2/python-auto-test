name: Python Auto Run Test

on:
  push:
    branches: [ "main" ] # コード保存時に自動実行
  schedule:
    - cron: '0 0 * * *' # 毎日日本時間 9:00 に自動実行

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      # ★ここにライブラリインストールの手順を追加します
      - name: 必要なライブラリのインストール
        run: pip install requests beautifulsoup4
        
      - name: Pythonスクリプトの実行
        run: python main.py
        
      - name: 生成されたCSVを保存
        uses: actions/upload-artifact@v4
        with:
          name: scraping-result
          path: output.csv
