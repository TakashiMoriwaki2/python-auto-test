name: Python Auto Run Test

on:
  push:
    branches: [ "main" ] # コード保存時に自動実行
  schedule:
    - cron: '0 1 * * 2' # 日本時間の毎週火曜日 10:00
  workflow_dispatch: # ★ここを追加（手動実行を可能にする）

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      # ★ここにライブラリインストールの手順を追加します
      - name: 必要なライブラリのインストール
        run: pip install requests beautifulsoup4 pandas
        
      - name: Pythonスクリプトの実行
        run: python main.py
        
      - name: 生成されたCSVをまとめて保存
        uses: actions/upload-artifact@v4
        with:
          name: scraping-results
          path: '*.csv'
  
      - name: WordPress APIのテスト実行
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python test_wp.py
